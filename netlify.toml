# =============================================================================
# Netlify configuration — Espacio Diseño (espaciodiseno.com.ph)
# Stack: Next.js 15 static export + Cloudflare CDN proxy
# =============================================================================

[build]
  base    = "espacio-diseno"
  command = "npm run build"
  publish = "espacio-diseno/out"

  [build.environment]
    NODE_VERSION            = "20"
    NEXT_TELEMETRY_DISABLED = "1"

# =============================================================================
# Redirects
# =============================================================================
# Next.js static export with trailingSlash: true emits paths like
#   /about-us/index.html
# Netlify serves these correctly when the URL ends with a slash.
# The rule below canonicalises bare paths → trailing-slash form so that
# Cloudflare and browsers always land on the canonical URL (avoids duplicate
# content and CLS from a redirect mid-load).
[[redirects]]
  from   = "/:path"
  to     = "/:path/"
  status = 301
  conditions = { Path = ["/:path"] }
  # Only redirect if the request is NOT already a slash-terminated path,
  # a file with an extension, or the root.  Netlify evaluates redirects
  # before serving files, so we must exclude static asset extensions.
  force  = false

# =============================================================================
# Security + cache headers
# =============================================================================

# --- Hashed immutable assets (/_next/static/) ---
# Next.js content-hashes every filename in this directory; safe to cache
# for a full year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Public images & fonts ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Videos (large files — cache 30 days, not immutable since filenames may change) ---
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# --- Icons / favicons ---
[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- HTML pages (short cache; Cloudflare edge cache handles the heavy lifting) ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Security headers (applied to every response) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    # Content-Security-Policy — kept permissive for now; tighten once all
    # third-party origins are audited (Google Fonts, Sanity CDN, etc.)
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-ancestors 'none';"
